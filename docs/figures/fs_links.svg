   <g id="text_18">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans Mono'" transform="translate(357.339442 41.268062)">Pull form: one thread per cell gathers what arrives on each of the 18 links</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans Mono'" transform="translate(357.339442 53.16489)">(a 2-D slice shows 8). A link is treated by where it comes from:</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans Mono'" transform="translate(357.339442 64.989531)"/>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans Mono'" transform="translate(357.339442 76.814172)">liquid (FLUID, INTERFACE)  streamed; the cell gains</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans Mono'" transform="translate(357.339442 89.278)">      Δm_q = φ (f_q,in - f_q̄,out),  φ = ½(ε_x + ε_n) between two</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans Mono'" transform="translate(357.339442 101.394672)">      interface cells, else 1. The same φ-weighted mass goes to</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans Mono'" transform="translate(357.339442 113.2915)">      the six face fluxes that melt_advect uses.</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans Mono'" transform="translate(357.339442 125.408172)">GAS                        rebuilt (Körner 2005), no mass:</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans Mono'" transform="translate(357.339442 137.232812)">      f_q = f^eq_q(ρ_G, u) + f^eq_q̄(ρ_G, u) - f_q̄</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans Mono'" transform="translate(357.339442 149.349484)">      ρ_G - 1 = 3 (p_gas - σ κ)        from step 1</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans Mono'" transform="translate(357.339442 161.466156)">      under a column's surface (a void): ρ_G - 6σ more</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans Mono'" transform="translate(357.339442 173.582828)">WALL, block edge          half-way bounce-back, no mass</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans Mono'" transform="translate(357.339442 185.479656)"/>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans Mono'" transform="translate(357.339442 197.304297)">A diagonal from liquid needs a liquid cell between to stream</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans Mono'" transform="translate(357.339442 209.201125)">(else gas between: rebuilt; walls between: bounce-back).</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans Mono'" transform="translate(357.339442 221.097953)">In an interface cell every force is scaled by clamp(ε, 0, 1),</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans Mono'" transform="translate(357.339442 232.922593)">and τ is raised to fs_tau (1.0).</text>
   </g>
   <g id="text_19">
