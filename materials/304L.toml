# Material parameter card: 304L stainless steel.
# Format: docs/MATERIAL_CARDS.md (schema 1). SI units; every value carries a ref.

[card]
schema_version = 1
material = "304L"
designation = { UNS = "S30403", spec = "AISI 304L; wrought per ASTM A240/A276; LPBF powder gas-atomised 304L" }
composition_wt_pct = { Fe = "bal", Cr = "18-20", Ni = "8-12", Mn = "<2", Si = "<0.75", N = "<0.10", C = "<0.03", note = "UNS S30403 ranges, not a measured heat" }
version = "1.0.0"
created = 2026-10-17
modified = 2026-10-17
status = "draft"
reviewed_by = ""

[[changelog]]
version = "1.0.0"
date = 2026-10-17
author = "research agent (Claude)"
changes = "Initial draft from literature: Kim 1975 304L tables, Mills 2002 melting range, Cezairliyan 1980 emittance, Simonds 2018 absorptance, Li & Tan 2017 growth kinetics, two 304L LPBF process sets."

