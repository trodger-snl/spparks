# Material parameter card: 316L stainless steel.
# Format: docs/MATERIAL_CARDS.md (schema 1). SI units; every value carries a ref.

[card]
schema_version = 1
material = "316L"
designation = { UNS = "S31603", spec = "NIST SRM 316L (Pichler 2020 samples); LPBF powder per ASTM F3184" }
composition_wt_pct = { Fe = "bal", Cr = "16-18", Ni = "10-14", Mo = "2-3", Mn = "<2", C = "<0.03", note = "UNS S31603 ranges, not a measured heat" }
version = "1.0.0"
created = 2026-10-17
modified = 2026-10-17
status = "draft"
reviewed_by = ""

[[changelog]]
version = "1.0.0"
date = 2026-10-17
author = "T. Rodgers"
changes = "Initial card from the examples/conduction_am decks (docs/CONDUCTION_SOURCE.md, Material)."

[references.pichler2020]
citation = "P. Pichler, B.J. Simonds, J.W. Sowards, G. Pottlacher, Measurements of thermophysical properties of solid and liquid NIST SRM 316L stainless steel, J. Mater. Sci. 55 (2020) 4081-4093"
doi = "10.1007/s10853-019-04261-6"
url = "https://www.ncbi.nlm.nih.gov/pmc/articles/PMC8193647/"

[references.mills2002]
citation = "K.C. Mills, Recommended Values of Thermophysical Properties for Selected Commercial Alloys, Woodhead Publishing (2002)"
isbn = "9781855735699"

[references.moose_ss316]
citation = "MOOSE heat_transfer module, ThermalSS316Properties (fits after Mills 2002)"
url = "https://github.com/idaholab/moose"

[thermal]
density = { value = 7900, unit = "kg/m^3", ref = "pichler2020", note = "room-temperature solid; the conduction solver uses one dense density" }
solidus = { value = 1675, unit = "K", ref = "pichler2020" }
liquidus = { value = 1708, unit = "K", ref = "pichler2020" }
latent_fusion = { value = 2.9e5, unit = "J/kg", ref = "pichler2020" }
conductivity = { T = [300, 600, 900, 1200, 1500, 1675], value = [13.8, 20.0, 24.8, 28.4, 30.6, 31.3], unit = "W/(m K)", extrapolation = "clamp", ref = ["mills2002", "moose_ss316"], note = "held at the solidus value in the liquid" }
heat_capacity = { T = [300, 473, 873, 1073, 1253, 1675, 1708], value = [483, 528, 595, 611, 624, 714, 847], unit = "J/(kg K)", extrapolation = "clamp", ref = "pichler2020" }
emissivity = { value = 0.4, unit = "1", ref = "estimate", note = "oxidised/rough LPBF surface; source not recorded" }

[thermal.linear]
# Rosenthal/Moser need one k and cp: the tables evaluated at T_ref unless
# conductivity/heat_capacity are given here.
T_ref = { value = 1000, unit = "K", ref = "estimate", note = "between preheat and solidus" }

[powder]
conductivity = { value = 0.3, unit = "W/(m K)", ref = "estimate", note = "loose powder in Ar, order of magnitude; source not recorded" }

[microstructure]
# SPPARKS calibrations: V(dT) polynomial in undercooling dT = liquidus - T, highest power first.
solid_front_vel = { coeffs = [1.091e-5, -2.034e-4, 2.74e-3, 1.151e-4], unit = "m/s", dT_unit = "K", ref = "calibration", note = "additive/texture default fit; origin not recorded" }
nucleation_density = { value = 1e14, unit = "1/m^3", ref = "calibration" }
critical_undercooling = { value = 5, unit = "K", ref = "calibration" }
undercooling_deviation = { value = 3, unit = "K", ref = "calibration" }
mean_nuclei_volume = { value = 8.4375e-16, unit = "m^3", ref = "calibration" }
nuclei_volume_deviation = { value = 1.5625e-17, unit = "m^3", ref = "calibration" }

# Process sets. These two are the example decks' settings, not measured LPBF
# builds; literature sets go alongside them.

[process.conduction_am_150W]
note = "examples/conduction_am in.thin_wall, in.large_rectangle, stitch_layers.py; power is absorbed power (absorptivity 1)"
power = { value = 150, unit = "W", ref = "calibration" }
absorptivity = { value = 1.0, unit = "1", ref = "calibration" }
speed = { value = 1.4, unit = "m/s", ref = "calibration" }
layer_thickness = { value = 30e-6, unit = "m", ref = "calibration", note = "large_rectangle.path z step" }
spot = { value = 59.4e-6, unit = "m", convention = "1/e radius", ref = "calibration" }
source_depth = { value = 99e-6, unit = "m", ref = "calibration", note = "Moser sz, a calibration, not a beam property" }
preheat = { value = 300, unit = "K", ref = "calibration" }
convection = { h = 25, T_inf = 300, unit = "W/(m^2 K)", atmosphere = "Ar", ref = "estimate" }

[process.single_track_340W]
note = "examples/conduction_am/in.single_track"
power = { value = 340, unit = "W", ref = "calibration" }
absorptivity = { value = 0.355, unit = "1", ref = "calibration" }
speed = { value = 1.2, unit = "m/s", ref = "calibration" }
hatch = { value = 40e-6, unit = "m", ref = "calibration" }
layer_thickness = { value = 30e-6, unit = "m", ref = "calibration" }
spot = { value = 50e-6, unit = "m", convention = "1/e radius", ref = "calibration" }
source_depth = { value = 75e-6, unit = "m", ref = "calibration" }
preheat = { value = 573, unit = "K", ref = "calibration" }
convection = { h = 25, T_inf = 300, unit = "W/(m^2 K)", atmosphere = "Ar", ref = "estimate" }
