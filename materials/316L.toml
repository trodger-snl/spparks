[thermal]
density = { value = 7900, unit = "kg/m^3", ref = "pichler2020", note = "room-temperature solid; the conduction solver uses one dense density" }
solidus = { value = 1675, unit = "K", ref = "pichler2020" }
liquidus = { value = 1708, unit = "K", ref = "pichler2020" }
latent_fusion = { value = 2.9e5, unit = "J/kg", ref = "pichler2020" }
conductivity = { T = [300, 600, 900, 1200, 1500, 1675], value = [13.8, 20.0, 24.8, 28.4, 30.6, 31.3], unit = "W/(m K)", extrapolation = "clamp", ref = ["mills2002", "moose_ss316"], note = "held at the solidus value in the liquid" }
heat_capacity = { T = [300, 473, 873, 1073, 1253, 1675, 1708], value = [483, 528, 595, 611, 624, 714, 847], unit = "J/(kg K)", extrapolation = "clamp", ref = "pichler2020" }
emissivity = { value = 0.4, unit = "1", ref = "estimate", note = "oxidised/rough LPBF surface; source not recorded" }

[thermal.linear]
# Rosenthal/Moser need one k and cp: the tables evaluated at T_ref unless
# conductivity/heat_capacity are given here.
T_ref = { value = 1000, unit = "K", ref = "estimate", note = "between preheat and solidus" }

[powder]
conductivity = { value = 0.3, unit = "W/(m K)", ref = "estimate", note = "loose powder in Ar, order of magnitude; source not recorded" }

# Blown-powder DED, from a survey of 19 melt-pool models (2006-2024; 11 read in
# full). Most let the powder arrive preheated by its flight through the beam
# and use a literature absorptivity for the pool (0.30 for 316 at 1.06 um in
# Manvatkar 2014, 0.3-0.7 lumped in Knapp 2017); cold powder with a tuned
# absorptivity is the minority. Deck: flow ... powder R r T <arrival K>.
ded_arrival_temperature = { value = 1693, unit = "K", ref = "knapp2017", uncertainty = [1000, 1693], uncertainty_type = "bounds", note = "a modelling assumption, not a measurement: Knapp 2017 take the powder as heated to the solidus (their 1693 K for 316L), Q = mdot cp (Tsol - Tamb); Manvatkar 2014 and Sattari 2024 compute it from an in-flight heat balance. Lower bound 1000 K is the coolest arrival temperature the survey found prescribed (a Ni model). Computed stream cores can be molten" }
ded_beam_attenuation = { value = 0.13, unit = "1", ref = "sattari2024", uncertainty = [0.07, 0.21], uncertainty_type = "bounds", note = "fraction of laser power intercepted by the powder stream: 0.11-0.15 computed for 316L (Sattari 2024); bounds are the 0.07-0.21 of Qi 2006 at 6-12 g/min (H13-type steel, CO2 laser). The energy-conserving treatment applies the pool absorptivity to the transmitted power and returns the intercepted part only with captured powder (Manvatkar 2014 Eq. 2). Depends on feed rate and nozzle, not on the alloy" }

[flow]
# Liquid-state properties for the conduction source's melt-pool flow (flow lbm).
# Read by flow lbm properties cards; else pass them in the deck (docs/MATERIAL_CARDS.md, Flow).
surface_tension = { value = 1.586, unit = "N/m", ref = ["leitner2021", "pichler2022"], uncertainty = 0.008, uncertainty_type = "2sigma", T_range = [1708, 1708], note = "at the liquidus 1708 K; electromagnetic levitation, oscillating drop, 15 samples of NIST SRM 1155a (the heat of pichler2020). Read from Leitner 2021 Table 3.8 (1586 +/- 8 mN/m, k = 2), which presents the data of the then-unpublished Pichler 2022; the journal paper itself was not opened (publisher blocked the download), so check its final numbers. About 7 % below Fukuyama 2019 and 7 % above Ozawa 2014 SUS316 at the liquidus (Leitner Sec. 3.2.1)" }
dsigma_dT = { value = 3.2e-4, unit = "N/(m K)", ref = ["leitner2021", "pichler2022"], uncertainty = 1.1e-4, uncertainty_type = "2sigma", T_range = [1695, 1857], composition = "NIST SRM 1155a: S 20 ppm (15-17 ppm after levitation), O 30 ppm (information value), Mn 1.59 wt% (1.0-1.4 after)", note = "POSITIVE: +0.32 +/- 0.11 mN/(m K) (Leitner 2021 Table 3.8), so the Marangoni flow runs inward, the reverse of the Ti-6Al-4V-like default. The sign and size of dsigma/dT of steels and Ni alloys depend on dissolved S and O (a few tens of ppm S turn it positive): match the composition entry to your feedstock before using it. Other values, all from sources opened for this card: Ozawa 2014 Eq. 15, SUS316 with 300 ppm S before and 60-70 ppm after levitation, sigma = 1481 + 0.1924 (T - 1692) mN/m over 1630-2140 K (also positive, in both a reducing and an Ar-He atmosphere); Mills 2004 Eq. 23, stainless steel free of S and O, 1840 - 0.4 (T - 1823) mN/m, i.e. -4.0e-4; Mills 2004 Table 4 (soluble O 5 ppm): 1772/1772/1766/1758 mN/m at 1800/1850/1900/1950 K for 10 ppm S, 1729/1735/1736/1733 for 20 ppm, 1699/1708/1712/1713 for 30 ppm, so the sign changes between about 10 and 30 ppm S; Sahoo 1988 Eq. 7, pure iron, 1.943 - 4.3e-4 (T - 1809) N/m. The -4.3e-4 used in an earlier 316L run is that pure-iron coefficient, right only for a steel with almost no S or O. The linear fit covers 150 K above the liquidus; Leitner notes it may flatten or turn over at higher temperature (the boomerang shape Ozawa 2014 saw for 304)" }
viscosity = { T = [1773, 1800, 1900], value = [8.07e-3, 7.54e-3, 5.98e-3], unit = "Pa s", extrapolation = "clamp", ref = "mills2004", note = "dynamic viscosity, Mills 2004 Table 3(b); the table follows Eq. 28, ln eta(mPa s) = -2.396 + 7950/T, which is R.F. Brooks's oscillation viscometry on one stainless steel (25.6Cr-6.5Ni-4Mo) applied by Mills to all stainless steels on the assumption that Fe, Cr and Ni have similar viscosities. Not a measurement on 316L. Mills warns that inclusions in commercial steels raise it. Kinematic: with the liquid density below, nu = 1.10e-6 m^2/s at 1800 K (7.54e-3 / 6875) and 8.8e-7 at 1900 K" }
density_liquid = { value = 6936, T_ref = 1708, slope = -0.661, unit = "kg/m^3", slope_unit = "kg/(m^3 K)", ref = "pichler2020", T_range = [1708, 2900], note = "Pichler 2020 Table 3, D(T) = 8065 - 0.661 T from ohmic pulse heating of SRM 1155a, evaluated at the liquidus. Leitner 2021 Table 3.8 confirms it by levitation: 6983 +/- 127 at 1708 K (+0.7 %), slope -0.55 +/- 2.47 over 1715-1789 K. Mills 2004 Eq. 6 gives a slope of -0.86 for stainless steels" }
thermal_expansion = { value = 9.5e-5, unit = "1/K", ref = "pichler2020", note = "volumetric, derived for this card as -slope/density of density_liquid at the liquidus (0.661 / 6936); 1.26e-4 from the Mills 2004 slope" }

[microstructure]
# V(dT) polynomial in undercooling dT = liquidus - T, highest power first; nucleation values are SPPARKS calibrations.
front_velocity_source = { form = "polynomial", coeffs = [1.091e-5, -2.034e-4, 2.74e-3, 1.151e-4], unit = "m/s", dT_unit = "K", ref = ["li_tan2017", "tan_shin2015"], note = "Li & Tan 2017 Eq. 4, applied there to 316L: a polynomial interpolation of KGT tip kinetics for austenitic stainless steel from Tan & Shin 2015 (closed access, not read). Traced by the 304L research agent. Nonzero constant term (V(0) = 0.115 mm/s) as printed" }
solid_front_vel = { coeffs = [1.091e-5, -2.034e-4, 2.74e-3, 1.151e-4], unit = "m/s", dT_unit = "K", ref = ["li_tan2017", "tan_shin2015"], fit_of = "front_velocity_source", fit_range_K = [0, 33], max_rel_err = 1e-9, note = "copied exactly from front_velocity_source; also the CPU additive/texture default" }
nucleation_density = { value = 1e14, unit = "1/m^3", ref = "calibration" }
critical_undercooling = { value = 5, unit = "K", ref = "calibration" }
undercooling_deviation = { value = 3, unit = "K", ref = "calibration" }
mean_nuclei_volume = { value = 8.4375e-16, unit = "m^3", ref = "calibration" }
nuclei_volume_deviation = { value = 1.5625e-17, unit = "m^3", ref = "calibration" }

