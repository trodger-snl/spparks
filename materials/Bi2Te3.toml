[thermal]
density = { value = 7740, unit = "kg/m^3", ref = ["zhang_leblanc2022", "zhang2018"], uncertainty = [7554, 7740], uncertainty_type = "bounds", T_range = [293, 300], note = "full density implied by zhang_leblanc2022 Sec. 2.2: LPBF disks of 6.27 and 6.81 g/cm^3 are quoted as 81 and 88% relative density (both ratios give 7.74 g/cm^3); the value is not printed as such. Lower bound: 7554 kg/m^3 'bulk density' used by oztan2022 Table 1 (citing carter2019, not read). One dense density for the conduction solver." }
liquidus = { value = 858, unit = "K", ref = "zhang_leblanc2022", uncertainty = [846, 858], uncertainty_type = "bounds", note = "congruent melting point 858 K, quoted by zhang_leblanc2022 from the CRC Handbook 95th ed. (not read). oztan2022 Table 1 uses 846 K (citing liu2013, not read); that spread is the lower bound." }
solidus = { value = 853, unit = "K", ref = "estimate", note = "MODELLING CHOICE. Bi2Te3 melts congruently, so physically solidus = liquidus. The app divides by tl - ts (undercooling normalisation t_cool_max = tl - ts; timestep rule dx/V(tl - ts)) and the conduction source releases latent heat linearly over [ts, tl], so a zero gap is degenerate. 5 K is chosen because (a) it is smaller than the 12 K spread between published melting points (846-858 K), (b) the Bi2Te3 phase has a narrow homogeneity range about 60 at.% Te (general Bi-Te phase-diagram knowledge, not cited here) and laser-melted tracks deviate from stoichiometry (oztan2022 EDS), so real melts freeze over a small range rather than at one temperature, and (c) it keeps the latent heat on five 1 K H(T) table steps. Consequences: misorientation-diffusion's Tcool/(tl - ts) saturates at 5 K undercooling, and the CPU-app timestep check dx/V(5 K) is loose." }
latent_fusion = { value = 1.51e5, unit = "J/kg", ref = ["oztan2022", "bolling1960"], note = "oztan2022 Table 1, citing Bolling 1960 (not read; paywalled, with a later erratum/addendum J. Chem. Phys. 36 (1962) 1085). Equals 121 kJ/mol at M = 800.76 g/mol." }
conductivity = { T = [300, 858], value = [1.6, 1.6], unit = "W/(m K)", extrapolation = "clamp", ref = ["wang2021", "goldsmid2014", "estimate"], uncertainty = [0.7, 3.0], uncertainty_type = "bounds", note = "ESTIMATE: one isotropic value for a randomly oriented polycrystal, held constant from 300 K through the melt and in the liquid. Basis: 300 K lattice k is ~1.65 W/(m K) in the cleavage plane and 0.64-0.79 along c (wang2021 review of measurements), a ~2:1 ratio (goldsmid2014); the orientation average (2*1.65 + 0.7)/3 = 1.33 plus an electronic part of a few tenths for undoped material gives ~1.6. Bounds: 0.7 = c-axis lattice value (strong c-axis texture, as LPBF columnar grains can produce), 3.0 = the 300 K value zhang_leblanc2022 quotes from the CRC Handbook. Doping (carrier concentration) shifts the electronic and bipolar parts. Temperature dependence is not tabulated: the lattice part falls roughly as 1/T while the bipolar part rises in undoped material above ~400 K (goldsmid2014), and no solid data up to 858 K were found. Liquid k was not found: oztan2022 fit Fedorov & Kazandzhan, Sov. Phys. Semicond. 2 (1968) 17 (liquid bismuth chalcogenides; not obtained), so the clamp holds the solid value in the liquid. Porosity of the 71-88% dense LPBF parts lowers effective k further." }
heat_capacity = { T = [300, 400, 500, 600, 700, 800, 858], value = [155.5, 162.4, 169.3, 176.2, 183.1, 190.0, 194.0], unit = "J/(kg K)", extrapolation = "clamp", ref = "tang_patent2021", note = "solid cp = 107.989 + 55.229e-3 T J/(mol K) as printed in US 10,913,117 B2 (Embodiment 1.1), divided by M = 0.80076 kg/mol; the patent does not name its source (the a + bT form is that of the Kubaschewski/Barin compilations, not checked). Check: 300 K value equals Dulong-Petit 15R/M = 155.7 J/(kg K). No liquid cp was found, so it is held at the 858 K value by the clamp. No latent peak here (latent_fusion carries it)." }
emissivity = { value = 0.66, unit = "1", ref = ["oztan2022", "bowley1961"], note = "'average powder bed thermal emissivity' of Bi2Te3 used by oztan2022 Table 1, citing Bowley 1961 (not read; a figure-of-merit measurement paper, so the value's provenance is weak). Applied to every top face in the conduction solver, dense or powder; a smooth melt is probably lower." }

[thermal.linear]
# Rosenthal/Moser need one k and cp: the tables evaluated at T_ref unless
# conductivity/heat_capacity are given here.
T_ref = { value = 600, unit = "K", ref = "estimate", note = "between preheat and the 858 K melting point; k is constant, so only cp (176 J/(kg K)) depends on it" }

[powder]
conductivity = { value = 0.1, unit = "W/(m K)", ref = "estimate", uncertainty = [0.05, 0.3], uncertainty_type = "bounds", note = "ESTIMATE, no Bi2Te3 powder-bed measurement found. Loose irregular powder (< 53 um, cohesive: angle of repose 50.7 deg, zhang_leblanc2022) in Ar or N2 is gas-dominated; with solid k ~1.6 (vs 15-30 for steels) the bed is expected at or below the ~0.1-0.3 typical of metal beds. Measure or calibrate it." }
packing = { value = 0.60, unit = "1", ref = ["oztan2022", "kamath2016"], note = "1 - powder bed porosity 0.40 used by oztan2022 Table 1, citing Kamath 2016 (a generic LPBF value, not a Bi2Te3 measurement). The cited LPBF builds are 71-88% dense, and the cohesive irregular powder spreads poorly (zhang_leblanc2022), so a real bed may be looser. Recorded only; not passed to the solver." }

[optical]
absorptivity = { value = 0.5, unit = "1", ref = ["oztan2022", "sobolev1968"], note = "absorptivity used by oztan2022 Table 1 for Bi2Te3 at 1070 nm, citing the Sobolev 1968 reflectivity spectra (0.7-12.5 eV; 1070 nm = 1.16 eV; not read). A flat, room-temperature surface at normal incidence absorbs less: n = 6.7, kappa = 5.9 at 1070 nm (greenaway1965 as quoted by zhang_leblanc2022) give R = 0.715, A = 0.285. A rough powder bed absorbs more (multiple reflection), and oztan2022 report enhanced absorption above ~30 W (keyhole onset). Calibrate against melt pools." }

[microstructure]
# Deliberately empty. solid_front_vel and the nucleation values are SPPARKS
# calibrations and none was found for Bi2Te3 (a faceted, anisotropically growing
# compound, for which KGT dendrite-tip laws do not apply directly). Supply
# solid_front_vel, nucleation_density, critical_undercooling,
# undercooling_deviation, mean_nuclei_volume and nuclei_volume_deviation in the
# deck after `material`. Do not reuse the 316L numbers.

# Process sets: published LPBF builds of undoped Bi2Te3 powder on custom
# machines. None reports spot convention, preheat, absorptivity or the
# substrate, so those records are left out. Layer thicknesses are POWDER layer
# heights: at packing ~0.6 the consolidated layer the model wants
# (docs/CONDUCTION_SOURCE.md, Density) is ~0.6x these.

