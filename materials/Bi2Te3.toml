[process.oztan2022_sff_25W]
note = "bulk 15 x 2 mm prisms, >= 2 mm tall; 25 W and 350 mm/s held constant while layer height (100/150/200 um), hatch (25/37.5 um), scan pattern and number of scans (1-5) varied. 150 um layers gave the best electrical conductivity; best relative density 71% (chess-plane pattern). Ar with O2 < 0.01%. Sieved < 53 um American Elements powder. '50 um spot size', no convention, so no spot record. oztan2022 ran single tracks at the same 25 W / 350 mm/s on 86%-dense compacts mounted on 304L."
