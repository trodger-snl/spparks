# Material parameter card: bismuth telluride, Bi2Te3 (undoped, stoichiometric).
# Format: docs/MATERIAL_CARDS.md (schema 1). SI units; every value carries a ref.
#
# Model caveats specific to this material (read before using the card):
# - Congruent melter. solidus is set a few K below liquidus by choice, see its note.
# - Anisotropic layered crystal (trigonal R-3m): k in the cleavage plane is ~2x
#   the c-axis value. The solver takes one scalar k(T); see the conductivity note.
#   The quaternion apps offer only 'cubic' or 'hcp' symmetry; Bi2Te3's Laue group
#   is -3m, so 'hcp' (6/mmm) folds together misorientations that are distinct.
# - Te volatility: Te vaporises from hot Bi2Te3 (goldsmid2014). Laser-melted tracks
#   deviate from stoichiometry both ways (oztan2022 EDS: Te/Bi 1.15-8.3 against
#   1.5, plus oxide), and 5 rescans flipped the Seebeck sign (oztan2022_sff).
#   oztan2022 model evaporation from ~1000 K (latent 6.34e5 J/kg). Neither the
#   conduction source nor the app models evaporation, its enthalpy or the
#   composition change, so peak temperatures above ~1000 K are overestimated.
# - No front-velocity law or nucleation values: Bi2Te3 grows faceted and no
#   published SPPARKS-style law was found. Give solid_front_vel and the five
#   nucleation values in the deck (init_app stops with an error until you do).

[card]
schema_version = 1
material = "Bi2Te3"
designation = { CAS = "1304-82-1", spec = "commercial undoped powder (Alfa Aesar 99.98%, American Elements in the cited LPBF work), sieved < 53 um" }
composition_wt_pct = { Bi = "52.20", Te = "47.80", note = "stoichiometric Bi2Te3 (M = 800.76 g/mol); not a measured heat. LPBF melting shifts it locally (Te-rich and Te-deficient regions and oxide in oztan2022 EDS/TEM)." }
version = "1.0.0"
created = 2026-10-23
modified = 2026-10-23
status = "draft"
reviewed_by = ""

