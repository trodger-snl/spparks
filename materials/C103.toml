# Material parameter card: niobium alloy C-103 (Nb-10Hf-1Ti).
# Format: docs/MATERIAL_CARDS.md (schema 1). SI units; every value carries a ref.
#
# Model caveats specific to this material (read before using the card):
# - Almost no thermophysical property of C-103 has been measured above 1600 K. The
#   conductivity and heat capacity tables are a published rule-of-mixtures model
#   (prabhune2025), checked here against one data-sheet range and one CALPHAD table; the
#   solidus, liquidus and latent heat are CALPHAD results; the liquid surface tension and
#   viscosity are those of pure niobium. Each note says so.
# - The 403 K freezing range (2277-2680 K) is a calculation, probably a non-equilibrium
#   (Scheil) solidus; see the solidus note. The conduction source spreads the latent heat
#   over that range.
# - Not on the card (no source): powder.conductivity, flow.dsigma_dT, flow.density_liquid
#   and every [microstructure] record. A conduction deck must give k_powder itself, and
#   init_app needs solid_front_vel and the nucleation values from the deck. miklas2022
#   holds the inputs of a KGT calculation for C-103 (Gibbs-Thomson coefficient 1.92e-7 K m;
#   Hf: k = 0.57, m = -4.93 K/wt%; Zr: k = 0.51, m = -9.34; Ti: k = 0.58, m = -14.91;
#   D = 2.0e-9 m^2/s for each, all CALPHAD or literature values) and fits V against
#   undercooling with a power law, but does not print the fitted constants.
# - Printability, as the opened sources state it: C-103 is the easy one of the family. It
#   prints crack-free to more than 99.8 % density by LPBF (orsborn2025, mireles2020) and no
#   impurity-induced cold cracking was found in laser DED, only lack-of-fusion pores that
#   HIP closed (thapliyal2025). It is sensitive to interstitial contamination, oxygen above
#   all (powder limit 600 ppm O for safe handling, mireles2020), and single tracks at
#   1.7 m/s balled (miklas2022).

[card]
schema_version = 1
material = "C103"
designation = { spec = "Nb-10Hf-1Ti; composition limits below from the Materion plate and sheet data sheet. UNS number and ASTM specification not looked up for this card" }
composition_wt_pct = { Nb = "bal", Hf = "9-11", Ti = "0.7-1.3", Zr = "<0.7", Ta = "<0.5", W = "<0.5", O = "<0.0225", N = "<0.015", C = "<0.015", H = "<0.001", note = "limits of materion_c103. Measured cast heat used for the single tracks of miklas2022 (Table 3.1): Hf 9.99, Ti 1.02, Zr 0.78, W 0.02, O 0.01, Nb 88.14. prabhune2025 models 88.3 Nb, 10 Hf, 1 Ti, 0.07 Zr" }
version = "1.0.0"
created = 2026-11-14
modified = 2026-11-14
status = "draft"
reviewed_by = ""

