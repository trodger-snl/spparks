# Material parameter card: Inconel 625 (IN625, UNS N06625).
# Format: docs/MATERIAL_CARDS.md (schema 1). SI units; every value carries a ref.

[card]
schema_version = 1
material = "IN625"
designation = { UNS = "N06625", spec = "ASTM F3056 (PBF nickel alloy UNS N06625); wrought ASTM B443/B446; W.Nr. 2.4856" }
composition_wt_pct = { Ni = ">=58.0", Cr = "20.0-23.0", Mo = "8.0-10.0", Nb_plus_Ta = "3.15-4.15", Fe = "<=5.0", C = "<=0.10", Mn = "<=0.50", Si = "<=0.50", P = "<=0.015", S = "<=0.015", Al = "<=0.40", Ti = "<=0.40", Co = "<=1.0", note = "UNS N06625 limits (Special Metals datasheet Table 1), not a measured heat. AM-Bench 2018 powder lot (heigel2020 Table 1): Ni 64.66, Cr 20.61, Mo 8.82, Nb 3.97, Fe 0.81, Ti 0.39, Al 0.3, Si 0.18, Co 0.17, Mn 0.04, C 0.02" }
version = "2.1.0"
created = 2026-10-17
modified = 2026-11-14
status = "draft"
reviewed_by = ""

[[changelog]]
version = "1.0.0"
date = 2026-10-17
author = "research agent (Claude)"
changes = "Initial card: Special Metals k/cp tables extended to the liquidus with the JMatPro fits of Lim 2023; AM-Bench 2018 bare-plate (Lane 2020) and build (Heigel 2020) process sets; Ye 2019 absorptivity; ExaCA v2.0 KGT power law for the front velocity."

[[changelog]]
version = "2.0.0"
date = 2026-10-17
author = "T. Rodgers"
changes = "solid_front_vel is now the front_velocity_source power law itself, which SPPARKS reads directly, instead of a degree-5 polynomial fit (4.8% max error); front velocities change by up to that error."

[[changelog]]
version = "2.1.0"
date = 2026-11-14
author = "research agent (Claude)"
changes = "Added [flow] (liquid surface tension, its temperature coefficient and density of Boehler L625 from Leitner 2021, viscosity from Pichler 2021) and two laser DED process sets (Fillingim 2024, Wang 2025). No existing value changed."

