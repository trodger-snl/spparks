# Laser DED (blown powder) process sets. Extra DED records (powder_feed,
# beam_diameter) are recorded only. Lia 2017 (abstract only) measured by
# calorimetry that 37 % of the laser energy was absorbed in total during DED
# of Inconel 625 at about 1 kW, 11 % of the total being lost with unfused
# powder: a guide for lambda in DED decks, not a value of any set below.

[process.ded_fillingim2024_2000W]
method = "laser DED, blown powder"
machine = "Okuma MU-8000V Laser EX hybrid, intermediate nozzle (1.5-3.5 mm spots)"
note = "10 x 5 x 9 mm wall of 100 % Inconel 625 (Praxair powder -106+45 um) on a 316L substrate, the reference sample of an Inconel 625/copper blending study (Tables 3 and 4); parameters from operator experience on this machine. Porosity 0.100 %, with cracking near the 316L substrate reported for the 75 % Inconel sample. Preheat, absorptivity, bead width and beam profile not reported."
power = { value = 2000, unit = "W", ref = "fillingim2024" }
speed = { value = 15e-3, unit = "m/s", ref = "fillingim2024", note = "900 mm/min" }
hatch = { value = 1.65e-3, unit = "m", ref = "fillingim2024", note = "stepover" }
layer_thickness = { value = 0.62e-3, unit = "m", ref = "fillingim2024" }
beam_diameter = { value = 3.5e-3, unit = "m", profile = "unstated", ref = "fillingim2024", note = "spot size with no stated convention or profile, so no spot record: give the source size in the deck" }
powder_feed = { value = 2.0e-4, unit = "kg/s", ref = "fillingim2024", note = "12 g/min" }

[process.ded_wang2025_1800W]
method = "laser DED, blown powder, graded build"
machine = "Raycham LDM-8060 L-DED, inert atmosphere"
note = "Inconel 625 end of an Inconel 625 to Ti-6Al-4V (TC4) graded build: 20 to 40 layers of IN625 on a 200 x 100 x 20 mm IN625 plate; rotating-electrode powders 45-105 um. The power was raised linearly with the TC4 fraction, 1800 W for IN625 to 2300 W for TC4 in 50 W steps per 10 vol% (Table 2), at fixed speed and layer thickness; shielding gas 15 L/min. Spot size, hatch and powder feed rate are not given in what I read."
power = { value = 1800, unit = "W", ref = "wang2025" }
speed = { value = 12e-3, unit = "m/s", ref = "wang2025", note = "720 mm/min" }
layer_thickness = { value = 0.6e-3, unit = "m", ref = "wang2025" }
