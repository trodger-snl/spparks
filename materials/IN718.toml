[[changelog]]
version = "1.0.0"
date = 2026-10-17
author = "research agent (Claude)"
changes = "Initial card from the literature: Agazhanov 2019 (k, cp, density), Hosaeus 2001 (solidus, liquidus, liquid cp and k), Greene 1999/2000 (emissivity), Honda 2025 (powder absorptivity), Wei 2018 (powder conductivity), Yuan 2023 (tip kinetics), process sets from Weaver 2024 (AM Bench 2022) and Wang 2023."

[[changelog]]
version = "2.0.0"
date = 2026-10-17
author = "T. Rodgers"
changes = "solid_front_vel is now the front_velocity_source power law itself, which SPPARKS reads directly, instead of a degree-6 polynomial fit (5.7% max error); front velocities change by up to that error."

