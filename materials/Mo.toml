url = "https://srd.nist.gov/jpcrdreprint/1.3253100.pdf"

[references.nist_webbook]
citation = "M.W. Chase Jr., NIST-JANAF Thermochemical Tables, 4th ed., J. Phys. Chem. Ref. Data Monograph 9 (1998), as given by the NIST Chemistry WebBook (SRD 69), molybdenum, condensed phase thermochemistry data (Shomate coefficients; data last reviewed March 1978)"
url = "https://webbook.nist.gov/cgi/cbook.cgi?ID=C7439987&Mask=2"

[references.nist_xcom_tab1]
