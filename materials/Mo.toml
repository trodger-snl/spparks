# Material parameter card: molybdenum, Mo (commercially pure).
# Format: docs/MATERIAL_CARDS.md (schema 1). SI units; every value carries a ref.
#
# Model caveats specific to this material (read before using the card):
# - Pure metal: one melting point. solidus is set 10 K below liquidus by choice, see its note.
# - Not on the card (no source opened): powder.conductivity, the thermal conductivity of
#   the liquid (the table is held at the last solid value) and every [microstructure]
#   record. A conduction deck must give k_powder itself, and init_app needs solid_front_vel
#   and the nucleation values from the deck.
# - The liquid properties in [flow], the liquid heat capacity and the emissivity were read
#   from abstracts only; the solid heat capacity and latent heat rest on the 1978 NIST-JANAF
#   review.
# - The process sets are weak: the pure-Mo paper prints one power-speed pair that lies
#   outside its own stated power range and gives no hatch or layer thickness; the other set
#   is for the alloy TZM. Neither has a melt-pool size.
# - Printability, as the opened sources state it: LPBF molybdenum cracks, with longitudinal
#   cracks along the track centre line and transverse cracks across it, and it balls
#   (yan2022). yan2022 puts it down to thermal stress in a metal that is brittle below its
#   ductile-to-brittle transition (375 K in their text) and to oxygen, which their EDS finds
#   in the built metal; keeping the part hot (support structures, plate preheat) and
#   lowering oxygen in powder and chamber suppressed cracks. A LANL report (mireles2025)
#   says Mo and W need a plate preheat of 800-1200 C where 80-200 C is enough for Ta and Nb.

[card]
schema_version = 1
material = "Mo"
designation = { spec = "commercially pure Mo; the lpbf_kanies2026_tzm_350W set is for the alloy TZM" }
composition_wt_pct = { Mo = "bal", note = "pure element; no measured powder chemistry in the sources read" }
version = "1.0.0"
created = 2026-11-14
modified = 2026-11-14
status = "draft"
reviewed_by = ""

[[changelog]]
version = "1.0.0"
date = 2026-11-14
author = "research agent (Claude)"
changes = "Initial card: Ho 1972 conductivity, NIST-JANAF heat capacity and heat of fusion, electrostatic-levitation liquid density, heat capacity, emissivity and surface tension (Paradis 2002, 2007, abstracts) and viscosity (Ishikawa 2013 via NIST ThermoML), flat-surface absorptivity from tabulated optical constants, one LPBF process set for pure Mo (Yan 2022) and one for TZM (Kanies 2026). No powder conductivity, liquid conductivity or microstructure records."

[references.ho1972]
citation = "C.Y. Ho, R.W. Powell, P.E. Liley, Thermal Conductivity of the Elements, J. Phys. Chem. Ref. Data 1 (1972) 279-421; molybdenum table read from the NIST reprint (scanned page, checked by eye)"
