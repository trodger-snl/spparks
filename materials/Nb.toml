# Material parameter card: niobium, Nb (commercially pure).
# Format: docs/MATERIAL_CARDS.md (schema 1). SI units; every value carries a ref.
#
# Model caveats specific to this material (read before using the card):
# - Pure metal: one melting point. solidus is set 10 K below liquidus by choice, see its note.
# - NO PROCESS SET. LPBF of pure niobium is published (griemsmann2021, candela2023), but the
#   one paper with parameter tables could not be opened and the other gives no power or
#   speed; see the comment at the end of the file.
# - Not on the card (no source opened): powder.conductivity, the thermal conductivity above
#   2200 K and of the liquid (the table is held at its last value) and every
#   [microstructure] record. A conduction deck must give k_powder itself, and init_app needs
#   solid_front_vel and the nucleation values from the deck.
# - The liquid properties in [flow], the liquid heat capacity and the emissivity were read
#   from abstracts only; the solid heat capacity and latent heat rest on the 1973 NIST-JANAF
#   review.
# - Printability, as the sources state it: niobium prints crack-free and dense in LPBF
#   (more than 99.9 % relative density, griemsmann2021 abstract; above 99.8 %, candela2023
#   abstract). Oxygen pickup embrittles it: the title of a 2023 paper not opened here
#   (Mater. Sci. Eng. A 866, 144691) names oxygen-assisted embrittlement of LPBF niobium.

[card]
schema_version = 1
material = "Nb"
designation = { spec = "commercially pure Nb; LPBF powder of candela2023: Taniobis AMtrinsic spherical, D10 18 um, D90 63 um" }
composition_wt_pct = { Nb = "bal", note = "pure element; no measured powder or sample chemistry was available to this card" }
version = "1.0.0"
created = 2026-11-14
modified = 2026-11-14
status = "draft"
reviewed_by = ""

[[changelog]]
version = "1.0.0"
date = 2026-11-14
author = "research agent (Claude)"
changes = "Initial card: Ho 1972 conductivity, NIST-JANAF heat capacity and heat of fusion, electrostatic-levitation liquid density, heat capacity, emissivity, surface tension and viscosity (Paradis 2001, 2002, abstracts), flat-surface absorptivity from tabulated optical constants. No process set, powder conductivity or microstructure records."

[references.ho1972]
citation = "C.Y. Ho, R.W. Powell, P.E. Liley, Thermal Conductivity of the Elements, J. Phys. Chem. Ref. Data 1 (1972) 279-421; niobium table read from the NIST reprint (scanned page, checked by eye)"
doi = "10.1063/1.3253100"
url = "https://srd.nist.gov/jpcrdreprint/1.3253100.pdf"

[references.nist_webbook]
citation = "M.W. Chase Jr., NIST-JANAF Thermochemical Tables, 4th ed., J. Phys. Chem. Ref. Data Monograph 9 (1998), as given by the NIST Chemistry WebBook (SRD 69), niobium, condensed phase thermochemistry data (Shomate coefficients; data last reviewed December 1973)"
url = "https://webbook.nist.gov/cgi/cbook.cgi?ID=C7440031&Mask=2"

[references.nist_xcom_tab1]
citation = "J.H. Hubbell, S.M. Seltzer, Tables of X-Ray Mass Attenuation Coefficients and Mass Energy-Absorption Coefficients, NIST Standard Reference Database 126 (NISTIR 5632), Table 1: material constants for elemental media"
url = "https://physics.nist.gov/PhysRefData/XrayMassCoef/tab1.html"

[references.paradis2001]
citation = "P.-F. Paradis, T. Ishikawa, S. Yoda, Non-contact measurements of thermophysical properties of niobium at high temperature, J. Mater. Sci. 36 (2001) 5125-5130; abstract only"
doi = "10.1023/A:1012477308332"

[references.paradis2002]
citation = "P.-F. Paradis, T. Ishikawa, S. Yoda, Non-Contact Measurements of Surface Tension and Viscosity of Niobium, Zirconium, and Titanium Using an Electrostatic Levitation Furnace, Int. J. Thermophys. 23 (2002) 825-842; abstract only"
doi = "10.1023/A:1015459222027"

[references.golovashkin1969]
citation = "A.I. Golovashkin, I.E. Leksina, G.P. Motulevich, A.A. Shubin, The optical properties of niobium, Sov. Phys. JETP 29 (1969) 27-34; paper not opened, n and k read from the refractiveindex.info data file Nb/nk/Golovashkin-293K"
url = "http://jetp.ac.ru/cgi-bin/e/index/e/29/1/p27?a=list"

[references.refractiveindex_info]
