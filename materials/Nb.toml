doi = "10.18429/JACoW-IPAC2023-THPM021"
url = "https://inspirehep.net/files/8c195566935f11794869ee0f7db5b995"

[thermal]
density = { value = 8570, unit = "kg/m^3", ref = "nist_xcom_tab1", T_range = [293, 293], note = "room-temperature solid as listed in the NIST table (8.570 g/cm^3; the table warns that some of its densities are nominal). The levitation fit of paradis2001 for the hot solid, 8.26e3 - 0.14 (T - Tm) kg/m^3 over 1500-2740 K, gives 8.43e3 at 1500 K. One dense density for the conduction solver." }
liquidus = { value = 2750, unit = "K", ref = "nist_webbook", uncertainty = [2742, 2750], uncertainty_type = "bounds", note = "melting point of pure Nb in the NIST-JANAF tables. The levitation papers (paradis2001, paradis2002) use 2742 K, the lower bound, and their fits in [flow] are written about that value." }
solidus = { value = 2740, unit = "K", ref = "estimate", note = "MODELLING CHOICE. A pure metal melts at one temperature, so physically solidus = liquidus. The app divides by tl - ts and the conduction source releases the latent heat linearly over [ts, tl], so a zero gap is degenerate (see the Bi2Te3 card). 10 K is arbitrary, about the 8 K spread between the two melting points quoted for the liquidus." }
latent_fusion = { value = 2.89e5, unit = "J/kg", ref = "nist_webbook", uncertainty = [2.89e5, 3.13e5], uncertainty_type = "bounds", note = "DERIVED for this card from the NIST-JANAF Shomate fits: H(liquid) - H(solid) at 2750 K = 26.87 kJ/mol, over 92.906 g/mol. Upper bound = 29.1 kJ/mol from the levitation cooling curves of paradis2001 (abstract; it depends on an assumed emissivity). The JANAF review is from 1973, and for tungsten the same tables are 30 % low (W card); no pulse-heating measurement was opened." }
conductivity = { T = [300, 400, 500, 600, 800, 1000, 1200, 1400, 1600, 1800, 2000, 2200], value = [53.7, 55.2, 56.7, 58.2, 61.3, 64.4, 67.5, 70.5, 73.6, 76.5, 79.1, 81.5], unit = "W/(m K)", extrapolation = "clamp", ref = "ho1972", note = "recommended values for well-annealed high-purity niobium, stated accurate to within 5 to 10 % at moderate temperatures and 15 % at high temperatures. The compilation stops at 2200 K: the table is HELD at 81.5 for the last 550 K of the solid and in the liquid, which is not a measurement. For tungsten the conductivity drops by about a quarter on melting (W card)." }
heat_capacity = { T = [300, 400, 600, 800, 1000, 1200, 1400, 1600, 1800, 2000, 2200, 2400, 2600, 2740, 2750], value = [266.5, 272.5, 283.7, 293.3, 301.8, 310.0, 318.9, 329.3, 342.1, 358.2, 378.6, 404.1, 435.6, 461.8, 437.0], unit = "J/(kg K)", extrapolation = "clamp", ref = ["nist_webbook", "paradis2001"], note = "solid: evaluated for this card from the NIST-JANAF Shomate coefficients (298-2750 K), converted with 92.906 g/mol. Last entry, the liquid at the liquidus: 40.6 J/(mol K) from the levitation cooling curves of paradis2001, C_p = 40.6 + 1.45e-3 (T - Tm) J/(mol K) on the assumption that the liquid's total hemispherical emissivity stays at 0.25 (abstract only). The JANAF liquid value is a constant 33.47 J/(mol K), 360 J/(kg K), a 1973 estimate." }
emissivity = { value = 0.23, unit = "1", ref = "paradis2001", T_range = [1500, 2740], note = "hemispherical total emissivity of the clean solid in high vacuum (levitated sample) at the melting point, from the fit 0.23 + 5.81e-5 (T - Tm) over 1500-2740 K, Tm = 2742 K, which gives 0.16 at 1500 K. The liquid was ASSUMED to be 0.25 by the authors. Abstract only. An oxidised or rough LPBF surface is higher." }

[thermal.linear]
# Rosenthal/Moser need one k and cp: the tables evaluated at T_ref unless
# conductivity/heat_capacity are given here.
T_ref = { value = 1500, unit = "K", ref = "estimate", note = "between preheat and the melting point, about 0.55 Tm as on the other cards; k = 72.1, cp = 323.8 there" }

[optical]
absorptivity = { value = 0.17, unit = "1", surface = "flat solid", ref = ["golovashkin1969", "refractiveindex_info"], note = "DERIVED for this card, not a measurement under the laser: 1 - R at normal incidence on a flat, clean surface at 293 K, from n = 1.56, k = 5.49 at 1.07 um in the refractiveindex.info Golovashkin file (0.170); it is the only data set for Nb in that database that reaches 1.07 um. An oxidised, rough or molten surface and a powder bed absorb more; no measurement on Nb at 1.07 um was found. A published C103 melt-pool model assumes 0.4 for the alloy (C103 card). Calibrate lambda against a melt-pool size rather than trusting this." }

[flow]
# Liquid-state properties for the conduction source's melt-pool flow (flow lbm).
# Read by flow lbm properties cards; else pass them in the deck (docs/MATERIAL_CARDS.md, Flow).
surface_tension = { value = 1.937, unit = "N/m", ref = "paradis2002", T_range = [2742, 2742], note = "at the melting point 2742 K of the paper: vacuum electrostatic levitation, oscillating drop, sigma = 1.937e3 - 0.199 (T - Tm) mN/m over 2320-2915 K (undercooled and superheated liquid). From the abstract; uncertainties, sample purity and oxygen content are not in it." }
dsigma_dT = { value = -1.99e-4, unit = "N/(m K)", ref = "paradis2002", T_range = [2320, 2915], composition = "not given in the abstract (purity and oxygen content of the levitated Nb sample unknown to this card)", note = "NEGATIVE, flow outward. Measured from 420 K below to 170 K above the melting point; a melt pool runs well above that. Nb dissolves oxygen readily; no data on how oxygen changes the coefficient was found." }
viscosity = { T = [2320, 2742, 2915], value = [6.87e-3, 4.50e-3, 3.53e-3], unit = "Pa s", extrapolation = "clamp", ref = "paradis2002", note = "dynamic viscosity, evaluated for this card from the linear fit of the abstract, eta = 4.50 - 5.62e-3 (T - Tm) mPa s over 2320-2915 K (oscillating-drop damping, vacuum electrostatic levitation). The same group later re-measured the viscosity of several refractory metals with an improved procedure (Meas. Sci. Technol. 23 (2012) 025305 and J. Chem. Thermodyn. 65 (2013) 1; for W, Ta and Mo the cards use the 2013 values), and the Tolias 2017 review on the W card says its 2005 tungsten viscosity had been affected by sample-positioning forces. Whether niobium was re-measured in the 2012 paper was not checked (not opened): treat 4.5 mPa s as provisional. A published C103 model uses 5.2 mPa s for Nb (C103 card). Kinematic: nu = 5.9e-7 m^2/s at the melting point with the liquid density below (4.50e-3 / 7690)." }
density_liquid = { value = 7690, T_ref = 2745, slope = -0.304, unit = "kg/m^3", slope_unit = "kg/(m^3 K)", ref = "leitner2019", T_range = [2745, 5847], uncertainty = [7600, 7780], uncertainty_type = "bounds", note = "ohmic pulse-heating of 99.9 wt% Nb wire, radial expansion by shadow imaging, nine experiments: rho = (8.52 +- 0.09)e3 - (0.304 +- 0.019) T kg/m^3 (Table II, k = 2), 7.69e3 +- 0.09e3 at the melting point 2745 K. Relative uncertainty 1.3 % at melting to 2.2 % at 5847 K. Chosen over the levitation fit of paradis2001 (abstract only: 7.95e3 - 0.23 (T - Tm) over 2340-2900 K, 3.4 % higher at melting) because it was read in full, states its uncertainty and reaches melt-pool temperatures. The paper says the later levitation value of Ishikawa 2005 (Meas. Sci. Technol. 16, 443; not opened) is 0.5 % above its own, with a 28 % steeper slope. Its Table III solid values just below melting are 7.8e3 to 7.9e3: about 2 % volume change on melting." }
thermal_expansion = { value = 3.95e-5, unit = "1/K", ref = "leitner2019", note = "DERIVED: volumetric, -slope/density of density_liquid at the melting point (0.304 / 7690). The paradis2001 abstract states 2.89e-5." }

# No [microstructure] section: no dendrite-tip or front-velocity law for niobium was found
# in a source that could be opened, and another metal's kinetics are not copied.

[powder]
psd = { D10 = 22.37e-6, D50 = 39.42e-6, D90 = 65.97e-6, unit = "m", method = "laser light scattering", ref = "griemsmann2021", note = "EIGA gas-atomised spherical Nb (Taniobis AMtrinsic), sieve fraction 10-63 um, oxygen 556 ppm, tap density 5.56 g/cm^3 (0.65 of dense), Hall flow 12 s. candela2023 used the same product: D10 18, D90 63 um." }

# LPBF, TruPrint 1000 (170 W maximum, 1070 nm, 30 um focus), 20 um layers, 5 mm cubes, Ar
# with O2 below 200 ppm, 4 mm chess fields, zigzag, 90 deg rotation per layer, no contours.
# Table 2 of griemsmann2021 lists 18 combinations above 99.9 % (110-170 W, 250-1250 mm/s,
# 65-85 um hatch, 105-400 J/mm^3); two are recorded: the densest and the fastest.
# The paper's Eq. 5 is a fitted density(P, v, h) surface over 90-170 W, 250-1500 mm/s,
# 20-100 um: a validation target for a porosity prediction.

[process.lpbf_griemsmann2021_130W]
outcome = { relative_density = 0.9997, cracking = "none", ref = "griemsmann2021", note = "cross-section image analysis; the paper calls the parts homogeneous and crack-free" }
method = "LPBF"
machine = "Trumpf TruPrint 1000"
note = "parameter combination 10 of Table 2, the densest: 173 J/mm^3, build-up rate 0.75 mm^3/s. As built: UTS 475 +- 11 MPa, yield 309 +- 11 MPa, elongation 16.6 +- 0.8 %, 149 +- 8 HV0.1; the strength, about twice wrought Nb, is put down to oxygen."
power = { value = 130, unit = "W", ref = "griemsmann2021" }
speed = { value = 0.5, unit = "m/s", ref = "griemsmann2021" }
hatch = { value = 75e-6, unit = "m", ref = "griemsmann2021" }
layer_thickness = { value = 20e-6, unit = "m", ref = "griemsmann2021" }
beam_diameter = { value = 30e-6, unit = "m", profile = "unstated", ref = "griemsmann2021", note = "focus diameter on the working level; convention not given" }

[process.lpbf_griemsmann2021_170W]
outcome = { relative_density = 0.9994, cracking = "none", ref = "griemsmann2021", note = "cross-section image analysis" }
method = "LPBF"
machine = "Trumpf TruPrint 1000"
note = "parameter combination 4 of Table 2, the highest build-up rate (1.63 mm^3/s) and lowest energy (105 J/mm^3) among those above 99.9 %. One tensile specimen: UTS 444 MPa, yield 324 MPa, elongation 8.3 %."
power = { value = 170, unit = "W", ref = "griemsmann2021" }
speed = { value = 1.25, unit = "m/s", ref = "griemsmann2021" }
hatch = { value = 65e-6, unit = "m", ref = "griemsmann2021" }
layer_thickness = { value = 20e-6, unit = "m", ref = "griemsmann2021" }
beam_diameter = { value = 30e-6, unit = "m", profile = "unstated", ref = "griemsmann2021", note = "focus diameter on the working level; convention not given" }

# Other LPBF sources for Nb:
# - candela2023 (read in full): EOS M100, 200 W maximum, 30 um layers; power, speed and hatch
#   were varied but the values are not printed. Density above 98.7 % in the body.
# - A Nb-1Zr parameter study with printed tables exists (LA-UR-26-28754, OSTI 17427277:
#   270 W, 650-790 mm/s, 0.1 mm hatch, 0.03 mm layer, EOS M290), but its powder turned out
#   to hold 0.9 wt% iron and the builds cracked, so it is not recorded as a set here.
