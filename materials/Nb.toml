# Material parameter card: niobium, Nb (commercially pure).
# Format: docs/MATERIAL_CARDS.md (schema 1). SI units; every value carries a ref.
#
# Model caveats specific to this material (read before using the card):
# - Pure metal: one melting point. solidus is set 10 K below liquidus by choice, see its note.
# - Two LPBF process sets (griemsmann2021, read in full). No DED set for pure Nb was found.
# - Not on the card (no source opened): powder.conductivity, the thermal conductivity above
#   2200 K and of the liquid (the table is held at its last value) and every
#   [microstructure] record. A conduction deck must give k_powder itself, and init_app needs
#   solid_front_vel and the nucleation values from the deck.
# - The surface tension and viscosity in [flow], the liquid heat capacity and the emissivity were read
#   from abstracts only; the solid heat capacity and latent heat rest on the 1973 NIST-JANAF
#   review.
# - Printability, as the sources state it: niobium prints crack-free and dense in LPBF
#   (more than 99.9 % relative density, griemsmann2021; above 99.8 %, candela2023
#   abstract). Oxygen pickup embrittles it: the title of a 2023 paper not opened here
#   (Mater. Sci. Eng. A 866, 144691) names oxygen-assisted embrittlement of LPBF niobium.

[card]
schema_version = 1
material = "Nb"
designation = { spec = "commercially pure Nb; LPBF powder of candela2023: Taniobis AMtrinsic spherical, D10 18 um, D90 63 um" }
composition_wt_pct = { Nb = "bal", note = "pure element; no measured powder or sample chemistry was available to this card" }
version = "1.1.0"
created = 2026-11-14
modified = 2026-11-14
status = "draft"
reviewed_by = ""

[[changelog]]
version = "1.0.0"
date = 2026-11-14
author = "research agent (Claude)"
changes = "Initial card: Ho 1972 conductivity, NIST-JANAF heat capacity and heat of fusion, electrostatic-levitation liquid density, heat capacity, emissivity, surface tension and viscosity (Paradis 2001, 2002, abstracts), flat-surface absorptivity from tabulated optical constants. No process set, powder conductivity or microstructure records."

[[changelog]]
version = "1.1.0"
date = 2026-11-14
author = "Claude, from PDFs supplied by the user"
changes = "griemsmann2021 and leitner2019 read in full: powder size distribution and two LPBF process sets added; liquid density and expansion replaced by the pulse-heating fit of leitner2019 (7690 at melting, was 7950 from the paradis2001 abstract)."

[references.ho1972]
