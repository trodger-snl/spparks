# Material parameter card: tantalum, Ta (commercially pure).
# Format: docs/MATERIAL_CARDS.md (schema 1). SI units; every value carries a ref.
#
# Model caveats specific to this material (read before using the card):
# - Pure metal: one melting point. solidus is set 10 K below liquidus by choice, see its note.
# - Not on the card (no source opened): thermal.emissivity, powder.conductivity, the thermal
#   conductivity of the liquid (the table is held at the last solid value) and every
#   [microstructure] record. A conduction deck must give emissivity and k_powder itself, and
#   init_app needs solid_front_vel and the nucleation values from the deck.
# - The liquid properties in [flow] and the Paradis latent-heat figures were read from
#   abstracts only; the heat capacity and latent heat rest on the 1972 NIST-JANAF review.
# - Printability, as the opened sources state it: tantalum prints dense and without cracks
#   in LPBF (99.9 %, lian2023; 0.02 % porosity, livescu2018), with strong texture and columnar
#   grains along the build direction. The problem is interstitial pickup: Ta has a high
#   affinity for oxygen and nitrogen, the built metal holds more of both than the powder
#   (lian2023 Table 4), and oxygen raises strength and hardness at the cost of ductility.
#   Too much energy gives spatter-induced pores (lian2023). In laser DED, low power or a
#   high feed rate gives lack of fusion and oxygen caused cracking in some samples (hilla2026).

[card]
schema_version = 1
material = "Ta"
designation = { spec = "commercially pure Ta; powders of the process sets: spherical 99.9 % (lian2023), Tekna ultra-low-oxygen spherical (livescu2018)" }
composition_wt_pct = { Ta = "bal", O = "0.0317", C = "0.0088", note = "measured powder of lian2023 (Table 2; total impurities below 0.1 wt%); built parts 426-508 ppm O and 132-179 ppm N depending on energy density. livescu2018 plate: 410 ppm O" }
version = "1.0.0"
created = 2026-11-14
modified = 2026-11-14
status = "draft"
reviewed_by = ""

