# Laser DED (blown powder, LENS) process sets. Extra DED records (powder_feed)
# are recorded only. Lia 2017 (abstract only) measured by calorimetry that 42 %
# of the laser energy was absorbed in total during DED of Ti-6Al-4V at about
# 1 kW, 14 % of the total being lost with unfused powder: a guide for lambda
# in DED decks, not a value of any set below.

[process.ded_marshall2016_lens_290W]
method = "laser DED, blown powder (LENS)"
machine = "OPTOMEC LENS 750 with a 1 kW Nd:YAG laser (IPG), four 1.016 mm nozzles"
note = "thin wall, one track wide, 60 layers of 50.8 mm on a Ti-6Al-4V substrate, unidirectional, return at 25.4 mm/s with the laser off; PREP powder 44-149 um (Phelly Materials); Ar-purged, 16.2 to 14.9 ppm O2; nozzle standoff about 6.7 mm at the start and 10.2 mm at the end (the wall built 27.56 mm against 30.48 mm set). Spot size, absorptivity and preheat not given. The dataset holds melt-pool pyrometer and infrared images per layer. Closest published set to the 150-300 W, 10 mm/s decks."
power = { value = 290, unit = "W", ref = "marshall2016" }
speed = { value = 12.7e-3, unit = "m/s", ref = "marshall2016" }
layer_thickness = { value = 0.508e-3, unit = "m", ref = "marshall2016", note = "z increment per layer" }
powder_feed = { value = 3.2e-4, unit = "kg/s", ref = "marshall2016", note = "0.32 g/s as printed (19 g/min), high for 290 W: most of it cannot have been captured" }
validation = { track_width = 1.78e-3, unit = "m", ref = "marshall2016", note = "measured thickness of the single-track wall (Table 1); mean layer height 27.56 mm / 60 = 0.46 mm" }

[process.ded_seely2024_fgm_ti1b]
