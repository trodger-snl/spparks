# Material parameter card: Ti-6Al-4V (Grade 5 / Grade 23 ELI).
# Format: docs/MATERIAL_CARDS.md (schema 1). SI units; every value carries a ref.

[card]
schema_version = 1
material = "Ti6Al4V"
designation = { UNS = "R56400 (Grade 5), R56401 (Grade 23 ELI)", spec = "LPBF: ASTM F2924 (Grade 5), ASTM F3001 (ELI)" }
composition_wt_pct = { Ti = "bal", Al = "5.50-6.75", V = "3.50-4.50", Fe = "<0.30", O = "<0.20", C = "<0.08", N = "<0.05", H = "<0.015", note = "Grade 5 ranges; ELI (F3001) narrows Al to 5.50-6.50, Fe <0.25, O <0.13, H <0.012. Al/V ranges as quoted by bartsch2021; interstitial limits from the ASTM F2924/F3001 tables, not re-checked against the standard text for this card. Measured LPBF powder heat (rottler2025 Table 1): Al 6.23, V 3.76, O 0.119, N 0.035, H 0.004." }
