# Material parameter card: tungsten, W (commercially pure).
# Format: docs/MATERIAL_CARDS.md (schema 1). SI units; every value carries a ref.
#
# Model caveats specific to this material (read before using the card):
# - Pure metal: one melting point. solidus is set 10 K below liquidus by choice, see its note.
# - Not on the card (no source opened): thermal.emissivity, powder.conductivity and every
#   [microstructure] record. A conduction deck must give emissivity and k_powder itself, and
#   init_app needs solid_front_vel and the nucleation values from the deck.
# - Printability, as the opened sources state it: LPBF tungsten cracks. li2020 shows
#   longitudinal cracks along the track centres and transverse cracks across tracks; tan2018
#   calls microcracks at grain boundaries along the build direction inevitable. The usual explanation
#   is delayed cracking once the solid cools below the ductile-to-brittle transition; karra2025
#   adds solidification cracking, with oxide exuding from longitudinal cracks made under argon
#   and none made in vacuum (their W-O calculation: more than about 15 ppmw O opens a freezing
#   range). Balling from the high surface tension and viscosity limits density (tan2018).

[card]
schema_version = 1
material = "W"
designation = { spec = "commercially pure W; powders of the process sets: plasma-spheroidised, 99.9 % (tan2018), spherical, purity not stated (li2020)" }
composition_wt_pct = { W = "bal", note = "pure element. Powder heats of the process sets: tan2018 O 220, C 580, N 470 ppm; li2020 not analysed. Levitation sample of ishikawa2005: 99.95 % wire (Nilaco), arc-melted" }
version = "1.0.0"
created = 2026-11-14
modified = 2026-11-14
status = "draft"
reviewed_by = ""

